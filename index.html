<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petfolk - Open Vial & Vaccine Lot Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase App & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --petfolk-bg: #FAF8F5;
      --petfolk-card-bg: #FFFFFF;
      --petfolk-text-main: #1D2A24;
      --petfolk-text-muted: #5C6B64;
      --petfolk-primary: #1C3F32;
      --petfolk-primary-hover: #122B22;
      --petfolk-accent: #E8F0EC;
      --petfolk-border: #E5EADF;
      
      --badge-safe-bg: #E3F2E9;
      --badge-safe-text: #1C5235;
      --badge-priority-bg: #FEF3D6;
      --badge-priority-text: #8C5300;
      --badge-critical-bg: #FCE4E4;
      --badge-critical-text: #9E2A2A;
      --badge-expired-bg: #EAEAEA;
      --badge-expired-text: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--petfolk-bg);
      color: var(--petfolk-text-main);
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--petfolk-primary);
      letter-spacing: -0.5px;
    }

    .header p {
      color: var(--petfolk-text-muted);
      font-size: 15px;
      margin-top: 6px;
    }

    .clinic-selector {
      background: var(--petfolk-card-bg);
      border: 1.5px solid var(--petfolk-primary);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .clinic-selector label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--petfolk-primary);
    }

    .clinic-selector select {
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 700;
      color: var(--petfolk-primary);
      outline: none;
      cursor: pointer;
    }

    .card {
      background: var(--petfolk-card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(29, 42, 36, 0.04);
      margin-bottom: 24px;
      border: 1px solid var(--petfolk-border);
    }

    .card-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .table-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sort-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--petfolk-text-muted);
    }

    .sort-group select {
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 8px;
    }

    .card h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--petfolk-primary);
    }

    .columns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 24px;
    }

    @media (max-width: 600px) {
      .columns-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--petfolk-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .checkbox-label {
      font-size: 13px !important;
      color: var(--petfolk-text-main) !important;
      text-transform: none !important;
      letter-spacing: normal !important;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    input[type="text"], input[type="date"], select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1
